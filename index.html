<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nhân Bet88</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 50% 45%, #681bc0 0%, #31076e 38%, #0c0119 78%, #020005 100%);
    overflow-x: hidden;
}

.header {
    height: 82px;
    display: flex;
    align-items: center;
    padding: 0 25px;
    background: rgba(5, 0, 15, .96);
    border-bottom: 1px solid #48206f;
}

.logo {
    width: 190px;
    text-align: center;
    font-size: 30px;
    font-weight: 900;
    color: #ffd52b;
    text-shadow: 0 0 8px white, 0 0 20px #ff9d00;
}

.logo span {
    display: block;
    color: white;
    font-size: 12px;
    letter-spacing: 5px;
}

.notice {
    flex: 1;
    text-align: center;
    color: #aaa0b5;
    font-size: 14px;
    line-height: 1.8;
}

.notice b {
    color: #5be33d;
}

.account {
    display: flex;
    align-items: center;
    gap: 10px;
}

.avatar {
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: linear-gradient(145deg, #8148ff, #22004d);
    border: 2px solid #a079ff;
    box-shadow: 0 0 15px #6124e8;
    font-size: 23px;
}

.username {
    width: 105px;
}

.username strong {
    display: block;
    font-size: 14px;
}

.username small {
    color: #ffd52b;
}

.balance {
    min-width: 180px;
    height: 47px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 8px;
    border-radius: 30px;
    background: linear-gradient(90deg, #21103d, #4e18a3);
    border: 1px solid #8056df;
    box-shadow: 0 0 15px rgba(111, 45, 230, .5);
}

.balance-coin {
    width: 35px;
    height: 35px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff4a0, #ffc21d 55%, #d36c00);
    border: 2px solid #ffdc5b;
}

.balance strong {
    flex: 1;
    color: #ffd52b;
    font-size: 15px;
}

.plus {
    width: 31px;
    height: 31px;
    border: 0;
    border-radius: 50%;
    background: #7138e4;
    color: white;
    font-size: 20px;
}

.main {
    min-height: calc(100vh - 82px);
    display: flex;
    justify-content: center;
    padding-top: 80px;
    position: relative;
}

.game {
    width: 920px;
    height: 620px;
    position: relative;
    border-radius: 75px;
    border: 4px solid #b98aff;
    background:
        radial-gradient(ellipse at center, #641fd6 0%, #45109c 42%, #2b0769 75%, #1b0343 100%);
    box-shadow:
        0 0 8px white,
        0 0 22px #b95cff,
        0 0 60px #7229e8,
        inset 0 0 65px rgba(143, 45, 255, .55);
}

.game::before {
    content: "";
    position: absolute;
    inset: 7px;
    border-radius: 66px;
    border: 2px solid rgba(255,255,255,.4);
    pointer-events: none;
}

.top-buttons {
    position: absolute;
    left: 0;
    right: 0;
    top: -43px;
    height: 70px;
    z-index: 30;
}

.top-button {
    position: absolute;
    width: 60px;
    height: 54px;
    border-radius: 19px;
    border: 2px solid #a789ff;
    background: linear-gradient(#6338ef, #21057e);
    color: white;
    font-size: 28px;
    box-shadow: 0 0 10px #713fff, inset 0 2px 3px rgba(255,255,255,.6);
}

.question {
    left: -12px;
}

.trophy {
    left: 215px;
}

.history-button {
    right: 215px;
}

.close {
    right: 35px;
    width: 65px;
    background: linear-gradient(#ee5d6b, #a91326);
    border-color: #ffaaaa;
    font-size: 34px;
}

.round {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 18px;
    z-index: 10;
}

.bet {
    position: absolute;
    top: 70px;
    width: 300px;
    text-align: center;
    z-index: 15;
}

.bet-tai {
    left: 25px;
}

.bet-xiu {
    right: 25px;
}

.bet-title {
    font-size: 72px;
    line-height: 1;
    font-weight: 1000;
}

.bet-tai .bet-title {
    color: #ffd52b;
    text-shadow: 0 0 5px white, 0 0 15px #ffb000, 0 0 30px #ff6100;
}

.bet-xiu .bet-title {
    color: #f4efff;
    text-shadow: 0 0 5px white, 0 0 15px #a66cff, 0 0 30px #6730ff;
}

.players {
    margin-top: 2px;
    font-size: 16px;
    color: #eee8f5;
}

.my-money {
    margin-top: 12px;
    color: #ffd52b;
    font-size: 25px;
    font-weight: bold;
}

.bet-button {
    width: 190px;
    height: 57px;
    margin-top: 14px;
    border-radius: 35px;
    border: 2px solid #82c0ff;
    background: linear-gradient(#5aa3ff, #1854df 60%, #082a91);
    color: white;
    font-size: 26px;
    font-weight: bold;
    box-shadow: 0 0 10px #318fff, 0 0 25px rgba(37,105,255,.55);
    cursor: pointer;
}

.bet-button:hover {
    transform: scale(1.04);
}

.dish {
    position: absolute;
    width: 265px;
    height: 265px;
    top: 53px;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 50%;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
}

.dish-outer {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(145deg, #e6e6e6, #686868 45%, #292929);
    border: 5px solid #f5f5f5;
    box-shadow:
        0 0 10px white,
        0 0 25px #a75cff,
        inset 0 0 25px #111;
}

.dish-inner {
    position: absolute;
    width: 225px;
    height: 225px;
    border-radius: 50%;
    background: radial-gradient(circle, #151515, #030303 70%);
    border: 4px solid #777;
    box-shadow: inset 0 0 35px black;
}

.lid {
    position: absolute;
    width: 245px;
    height: 245px;
    border-radius: 50%;
    background:
        radial-gradient(circle at 35% 28%, #934cff, #3a087f 50%, #15002f 100%);
    border: 6px solid #c5a0ff;
    box-shadow:
        0 0 15px #d08aff,
        0 0 35px #7c32ef,
        inset 0 0 30px #17002e;
    z-index: 5;
    transition: transform .8s cubic-bezier(.2,.8,.2,1), opacity .4s;
}

.lid::before {
    content: "";
    position: absolute;
    inset: 12px;
    border-radius: 50%;
    border: 3px dashed rgba(255,255,255,.7);
}

.lid-handle {
    position: absolute;
    width: 60px;
    height: 60px;
    top: -25px;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 20px;
    background: linear-gradient(#eeeeee, #777777);
    border: 3px solid white;
    box-shadow: 0 0 10px #aaa;
}

.dice-area {
    position: relative;
    z-index: 3;
    display: flex;
    gap: 15px;
}

.dice {
    width: 62px;
    height: 62px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 13px;
    background: linear-gradient(145deg, #ffffff, #cfcfcf);
    color: #181818;
    font-size: 35px;
    font-weight: 900;
    border: 3px solid #777;
    box-shadow: 0 5px 10px black;
}

.shaking {
    animation: shake .12s infinite;
}

@keyframes shake {
    0% { transform: translate(0,0) rotate(0); }
    25% { transform: translate(-5px,3px) rotate(-5deg); }
    50% { transform: translate(4px,-3px) rotate(5deg); }
    75% { transform: translate(-3px,-2px) rotate(-3deg); }
    100% { transform: translate(2px,3px) rotate(3deg); }
}

.open .lid {
    transform: translateY(-150px) rotate(15deg);
    opacity: 0;
}

.timer {
    position: absolute;
    width: 285px;
    height: 285px;
    top: 47px;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 50%;
    z-index: 8;
    pointer-events: none;
}

.timer-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 6px solid #9e51ff;
    box-shadow: 0 0 15px #a44fff, inset 0 0 15px #7c36e8;
}

.timer-number {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 86px;
    font-weight: 900;
    color: #edfaff;
    text-shadow: 0 0 5px white, 0 0 20px #48baff;
}

.sound {
    position: absolute;
    left: 50%;
    transform: translateX(110px);
    bottom: 185px;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: 2px solid #c9baff;
    background: #10001f;
    color: white;
    font-size: 24px;
    box-shadow: 0 0 15px #753dff;
    z-index: 25;
}

.chip-panel {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 74px;
    width: 700px;
    min-height: 82px;
    padding: 8px 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border-radius: 45px;
    background: linear-gradient(90deg, rgba(21,0,45,.96), rgba(51,10,100,.98), rgba(21,0,45,.96));
    border: 2px solid #8d61e9;
    box-shadow: 0 0 18px rgba(105,42,220,.7);
    z-index: 30;
}

.chip-button {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    position: relative;
    color: white;
    font-size: 12px;
    font-weight: 900;
    border: 5px dashed rgba(255,255,255,.9);
    cursor: pointer;
    box-shadow: 0 5px 10px rgba(0,0,0,.7), inset 0 0 9px rgba(255,255,255,.5);
    transition: .15s;
}

.chip-button:hover {
    transform: translateY(-5px) scale(1.05);
}

.chip-button.selected {
    transform: translateY(-7px) scale(1.1);
    box-shadow: 0 0 10px white, 0 0 22px #ffe65c;
}

.chip-1k {
    background: radial-gradient(circle,#ffef4d,#d87900);
}

.chip-5k {
    background: radial-gradient(circle,#65dfff,#006bb7);
}

.chip-10k {
    background: radial-gradient(circle,#ff72e9,#8c168e);
}

.chip-50k {
    background: radial-gradient(circle,#65e875,#07852c);
}

.chip-100k {
    background: radial-gradient(circle,#eeeeee,#777777);
}

.chip-200k {
    background: radial-gradient(circle,#ff704e,#9e1c08);
}

.chip-500k {
    background: radial-gradient(circle,#b98aff,#4b16a5);
}

.chip-1m {
    background: radial-gradient(circle,#ffe77a,#a86a00);
}

.double-button {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: 3px solid #e7c65a;
    background: linear-gradient(#d9a71d,#7e4300);
    color: white;
    font-size: 17px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 0 12px #ffbd20;
}

.selected-money {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 16px;
    min-width: 250px;
    text-align: center;
    color: #cfc2dc;
    font-size: 13px;
    z-index: 30;
}

.selected-money strong {
    color: #ffd52b;
    font-size: 18px;
}

.status {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 206px;
    color: #d7c9e7;
    font-size: 12px;
    z-index: 25;
    white-space: nowrap;
}

.history {
    position: absolute;
    left: 48px;
    right: 48px;
    bottom: -28px;
    height: 57px;
    padding-left: 67px;
    display: flex;
    align-items: center;
    gap: 13px;
    border-radius: 32px;
    background: linear-gradient(90deg,#18002f,#2c0762);
    border: 3px solid #9f77ff;
    box-shadow: 0 0 15px #6935dc;
    z-index: 35;
}

.history-icon {
    position: absolute;
    left: -4px;
    width: 66px;
    height: 66px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 20px;
    background: linear-gradient(135deg,#e954db,#6819ed);
    border: 2px solid #ffbaff;
    box-shadow: 0 0 15px #c23cff;

.history-dot {

}

.history-dot.tai {

}

.history-dot.xiu {
    background: #f2efff;

}

@media(max-width:1050px) {
    .notice {

    }

    }

    }

    .dice {

    }

}
</style>
</head>

<body>

<header class="header">

    <div class="logo">
        TÀI XỈU
        <span>DEMO GAME</span>
    </div>

    <div class="notice">
        Phiên bản mô phỏng bằng điểm ảo
        <br>
        Chúc bạn chơi vui vẻ!
    </div>

    <div class="account">

        <div class="avatar">👤</div>

        <div class="username">
            <strong>Nhanzdai102</strong>
            <small>VIP 8</small>
        </div>

        <div class="balance">
            <div class="balance-coin">🪙</div>
            <strong id="balance">1M</strong>
            <button class="plus">+</button>
        </div>

    </div>

</header>

<main class="main">

<section class="game">

    <div class="top-buttons">
        <button class="top-button question">?</button>
        <button class="top-button trophy">🏆</button>
        <button class="top-button history-button">↶</button>
        <button class="top-button close">×</button>
    </div>

    <div class="round">
        #<span id="round">2340960</span>
    </div>

    <div class="bet bet-tai">

        <div class="bet-title">TÀI</div>

        <div class="players">
            👤 1 người chơi
        </div>

        <div class="my-money" id="taiAmount">
            0
        </div>

        <button class="bet-button" onclick="placeBet('tai')">
            ĐẶT
        </button>

    </div>

    <div class="bet bet-xiu">

        <div class="bet-title">XỈU</div>

        <div class="players">
            👤 1 người chơi
        </div>

        <div class="my-money" id="xiuAmount">
            0
        </div>

        <button class="bet-button" onclick="placeBet('xiu')">
            ĐẶT
        </button>

    </div>

    <div class="dish" id="dish">

        <div class="dish-outer"></div>

        <div class="dish-inner"></div>

        <div class="dice-area" id="diceArea">

            <div class="dice" id="dice1">⚀</div>
            <div class="dice" id="dice2">⚀</div>
            <div class="dice" id="dice3">⚀</div>

        </div>

        <div class="lid">

            <div class="lid-handle"></div>

        </div>

    </div>

    <div class="timer">

        <div class="timer-ring"></div>

        <div
            class="timer-number"
            id="timer">
            30
        </div>

    </div>

    <button
        class="sound"
        onclick="toggleSound()">
        🔇
    </button>

    <div
        class="status"
        id="status">
        Chọn chip để bắt đầu.
    </div>

    <div class="chip-panel">

        <button
            class="chip-button chip-1k"
            onclick="addChip(1000,this)">
            1K
        </button>

        <button
            class="chip-button chip-5k"
            onclick="addChip(5000,this)">
            5K
        </button>

        <button
            class="chip-button chip-10k"
            onclick="addChip(10000,this)">
            10K
        </button>

        <button
            class="chip-button chip-50k"
            onclick="addChip(50000,this)">
            50K
        </button>

        <button
            class="chip-button chip-100k"
            onclick="addChip(100000,this)">
            100K
        </button>

        <button
            class="chip-button chip-200k"
            onclick="addChip(200000,this)">
            200K
        </button>

        <button
            class="chip-button chip-500k"
            onclick="addChip(500000,this)">
            500K
        </button>

        <button
            class="chip-button chip-1m"
            onclick="addChip(1000000,this)">
            1M
        </button>

        <button
            class="double-button"
            onclick="doubleChip()">
            ×2
        </button>

    </div>

    <div class="selected-money">
        Đang chọn:
        <strong id="selectedAmount">0</strong>
    </div>

    <div class="history">

        <div class="history-icon">
            📈
        </div>

        <div class="history-dot tai"></div>
        <div class="history-dot xiu"></div>
        <div class="history-dot tai"></div>
        <div class="history-dot tai"></div>
        <div class="history-dot xiu"></div>
        <div class="history-dot tai"></div>
        <div class="history-dot xiu"></div>

    </div>

</section>

</main>

<script>

let balance = 1000000;
let selectedAmount = 0;
let taiAmount = 0;
let xiuAmount = 0;
let round = 2340960;
let time = 30;
let gameRunning = true;
let soundOn = false;
let timerInterval;

const balanceElement = document.getElementById("balance");
const selectedElement = document.getElementById("selectedAmount");
const taiElement = document.getElementById("taiAmount");
const xiuElement = document.getElementById("xiuAmount");
const timerElement = document.getElementById("timer");
const roundElement = document.getElementById("round");
const statusElement = document.getElementById("status");
const dish = document.getElementById("dish");
const diceArea = document.getElementById("diceArea");

const diceElements = [
    document.getElementById("dice1"),
    document.getElementById("dice2"),
    document.getElementById("dice3")
];

const diceFaces = [
    "⚀",
    "⚁",
    "⚂",
    "⚃",
    "⚄",
    "⚅"
];

function formatNumber(number) {

    if (number >= 1000000) {
        return (number / 1000000).toLocaleString("vi-VN", {
            maximumFractionDigits: 2
        }) + "M";
    }

    if (number >= 1000) {
        return (number / 1000).toLocaleString("vi-VN", {
            maximumFractionDigits: 2
        }) + "K";
    }

    return number.toLocaleString("vi-VN");
}

function updateUI() {

    balanceElement.textContent =
        formatNumber(balance);

    selectedElement.textContent =
        formatNumber(selectedAmount);

    taiElement.textContent =
        formatNumber(taiAmount);

    xiuElement.textContent =
        formatNumber(xiuAmount);
}

function addChip(amount, button) {

    if (!gameRunning) {
        return;
    }

    if (selectedAmount + amount > balance) {

        statusElement.textContent =
            "Không đủ điểm để chọn chip này.";

        return;
    }

    selectedAmount += amount;

    updateUI();

    document
        .querySelectorAll(".chip-button")
        .forEach(chip => {
            chip.classList.remove("selected");
        });

    button.classList.add("selected");

    statusElement.textContent =
        "Đang chọn " +
        formatNumber(selectedAmount) +
        " điểm.";
}

function doubleChip() {

    if (!gameRunning) {
        return;
    }

    if (selectedAmount <= 0) {

        statusElement.textContent =
            "Hãy chọn chip trước.";

        return;
    }

    if (selectedAmount * 2 > balance) {

        statusElement.textContent =
            "Không đủ điểm để nhân đôi.";

        return;
    }

    selectedAmount *= 2;

    updateUI();

    statusElement.textContent =
        "Đã ×2 thành " +
        formatNumber(selectedAmount) +
        " điểm.";
}

function placeBet(side) {

    if (!gameRunning) {
        return;
    }

    if (selectedAmount <= 0) {

        statusElement.textContent =
            "Bạn chưa chọn chip.";

        return;
    }

    if (selectedAmount > balance) {

        statusElement.textContent =
            "Không đủ điểm.";

        return;
    }

    balance -= selectedAmount;

    if (side === "tai") {

        taiAmount += selectedAmount;

        statusElement.textContent =
            "Đã đặt " +
            formatNumber(selectedAmount) +
            " điểm vào TÀI.";
    }

    if (side === "xiu") {

        xiuAmount += selectedAmount;

        statusElement.textContent =
            "Đã đặt " +
            formatNumber(selectedAmount) +
            " điểm vào XỈU.";
    }

    selectedAmount = 0;

    document
        .querySelectorAll(".chip-button")
        .forEach(chip => {
            chip.classList.remove("selected");
        });

    updateUI();
}

function randomDice() {

    return Math.floor(Math.random() * 6);
}

function shakeDice() {

    diceElements.forEach(dice => {
        dice.classList.add("shaking");
    });

    let count = 0;

    const animation =
        setInterval(() => {

            diceElements.forEach(dice => {

                const value =
                    randomDice();

                dice.textContent =
                    diceFaces[value];

            });

            count++;

            if (count >= 25) {

                clearInterval(animation);

                diceElements.forEach(dice => {
                    dice.classList.remove("shaking");
                });

                openDish();
            }

        }, 100);
}

function openDish() {

    dish.classList.add("open");

    setTimeout(() => {

        const values = diceElements.map(() =>
            Math.floor(Math.random() * 6) + 1
        );

        diceElements.forEach((dice, index) => {

            dice.textContent =
                diceFaces[values[index] - 1];

        });

        const total =
            values[0] +
            values[1] +
            values[2];

        const result =
            total >= 11
                ? "TÀI"
                : "XỈU";

        statusElement.textContent =
            "Kết quả: " +
            result +
            " - Tổng " +
            total;

        addHistory(result);

        setTimeout(newRound, 3500);

    }, 700);
}

function startRound() {

    clearInterval(timerInterval);

    time = 30;

    gameRunning = true;

    dish.classList.remove("open");

    timerElement.textContent =
        time;

    timerInterval =
        setInterval(() => {

            time--;

            timerElement.textContent =
                time;

            if (time <= 0) {

                clearInterval(timerInterval);

                gameRunning = false;

                statusElement.textContent =
                    "Đang lắc xúc xắc...";

                shakeDice();
            }

        }, 1000);
}

function newRound() {

    round++;

    roundElement.textContent =
        round;

    taiAmount = 0;
    xiuAmount = 0;

    selectedAmount = 0;

    updateUI();

    statusElement.textContent =
        "Phiên mới bắt đầu.";

    startRound();
}

function addHistory(result) {

    const history =
        document.querySelector(".history");

    const dot =
        document.createElement("div");

    dot.className =
        "history-dot " +
        (
            result === "TÀI"
                ? "tai"
                : "xiu"
        );

    history.appendChild(dot);

    const dots =
        history.querySelectorAll(".history-dot");

    if (dots.length > 10) {
        dots[0].remove();
    }
}

function toggleSound() {

    soundOn = !soundOn;

    document.querySelector(".sound").textContent =
        soundOn
            ? "🔊"
            : "🔇";
}

updateUI();

startRound();

</script>

</body>
</html>
