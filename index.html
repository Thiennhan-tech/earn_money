<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tài Xỉu Demo</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    overflow-x: hidden;

    background:
        radial-gradient(
            circle at 50% 42%,
            #5a16a8 0%,
            #29065c 35%,
            #0d011b 70%,
            #030006 100%
        );
}

body::before {
    content: "";
    position: fixed;
    inset: 0;

    background-image:
        radial-gradient(
            circle,
            rgba(255,255,255,.08) 1px,
            transparent 1px
        );

    background-size: 40px 40px;
    pointer-events: none;
}


.header {
    height: 82px;

    display: flex;
    align-items: center;

    padding: 0 25px;

    background: rgba(4,0,12,.94);

    border-bottom: 1px solid #42156d;
}

.logo {
    width: 190px;

    text-align: center;

    font-size: 30px;
    font-weight: 1000;

    color: #ffd52b;

    text-shadow:
        0 0 5px white,
        0 0 15px #ffae00,
        0 0 30px #ff4c00;
}

.logo span {
    display: block;

    font-size: 13px;
    letter-spacing: 5px;

    color: white;
}

.notice {
    flex: 1;

    text-align: center;

    color: #9d91aa;

    font-size: 14px;

    line-height: 1.8;
}

.notice b {
    color: #5ee034;
}

.account {
    display: flex;
    align-items: center;
    gap: 10px;
}

.avatar {
    width: 48px;
    height: 48px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        linear-gradient(
            145deg,
            #8148ff,
            #22004d
        );

    border: 2px solid #a079ff;

    box-shadow:
        0 0 15px #6124e8;

    font-size: 23px;
}

.username {
    width: 105px;
}

.username strong {
    display: block;
    font-size: 14px;
}

.username small {
    color: #ffd52b;
}

.balance {
    height: 47px;

    min-width: 175px;

    display: flex;
    align-items: center;

    gap: 8px;

    padding: 5px 8px;

    border-radius: 30px;

    background:
        linear-gradient(
            90deg,
            #21103d,
            #4e18a3
        );

    border: 1px solid #8056df;

    box-shadow:
        0 0 15px rgba(111,45,230,.5);
}

.balance-coin {
    width: 35px;
    height: 35px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fff4a0,
            #ffc21d 55%,
            #d36c00
        );

    color: #814200;

    border: 2px solid #ffdc5b;
}

.balance strong {
    flex: 1;

    color: #ffd52b;

    font-size: 16px;
}

.plus {
    width: 31px;
    height: 31px;

    border: 0;

    border-radius: 50%;

    color: white;

    background: #7138e4;

    font-size: 20px;
}




.main {
    position: relative;

    min-height: calc(100vh - 82px);

    display: flex;
    justify-content: center;

    padding-top: 80px;
}



.decor-chips {
    position: absolute;

    width: 120px;
    height: 160px;
}

.decor-left {
    left: calc(50% - 570px);
    top: 220px;
}

.decor-right {
    right: calc(50% - 570px);
    top: 220px;
}

.decor-chip {
    position: absolute;

    width: 75px;
    height: 75px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    border: 5px dashed rgba(255,255,255,.85);

    font-weight: bold;

    box-shadow:
        0 7px 15px rgba(0,0,0,.7),
        inset 0 0 8px rgba(255,255,255,.5);
}

.decor-chip::after {
    content: "";

    position: absolute;

    width: 43px;
    height: 43px;

    border-radius: 50%;

    border: 2px solid rgba(255,255,255,.75);
}

.decor-chip:nth-child(1) {
    left: 5px;
    top: 45px;

    background:
        radial-gradient(
            circle,
            #ffd32e 0 35%,
            #d76c00 36% 100%
        );
}

.decor-chip:nth-child(2) {
    left: 42px;
    top: 5px;

    background:
        radial-gradient(
            circle,
            #f4f1ff 0 35%,
            #8261d5 36% 100%
        );

    transform: rotate(14deg);
}

.decor-chip:nth-child(3) {
    left: 52px;
    top: 82px;

    background:
        radial-gradient(
            circle,
            #ffbd22 0 35%,
            #dd6200 36% 100%
        );

    transform: rotate(22deg);
}

.decor-right .decor-chip:nth-child(1) {
    left: 40px;
}

.decor-right .decor-chip:nth-child(2) {
    left: 0;
    top: 12px;
}

.decor-right .decor-chip:nth-child(3) {
    left: 48px;
    top: 82px;
}


.game {

    width: 920px;
    height: 590px;

    position: relative;

    border-radius: 75px;

    border: 4px solid #b98aff;

    background:
        radial-gradient(
            ellipse at center,
            #5c1bd2 0%,
            #42109c 40%,
            #2d0870 72%,
            #1c0348 100%
        );

    box-shadow:
        0 0 6px white,
        0 0 20px #b95cff,
        0 0 55px #7229e8,
        0 0 100px rgba(105,35,255,.55),
        inset 0 0 60px rgba(143,45,255,.55);

    overflow: visible;
}

.game::before {

    content: "";

    position: absolute;

    inset: 6px;

    border-radius: 67px;

    border: 2px solid rgba(255,255,255,.4);

    pointer-events: none;
}

.game::after {

    content: "";

    position: absolute;

    inset: 15px;

    border-radius: 58px;

    border: 1px solid rgba(255,255,255,.12);

    pointer-events: none;
}



.top-buttons {

    position: absolute;

    left: 0;
    right: 0;

    top: -43px;

    height: 70px;

    z-index: 20;
}

.top-button {

    position: absolute;

    width: 60px;
    height: 54px;

    border-radius: 19px;

    border: 2px solid #a789ff;

    background:
        linear-gradient(
            #6338ef,
            #21057e
        );

    color: white;

    font-size: 28px;

    box-shadow:
        0 0 10px #713fff,
        inset 0 2px 3px rgba(255,255,255,.6);

    cursor: pointer;
}

.question {
    left: -12px;
}

.trophy {
    left: 215px;
}

.history-button {
    right: 215px;
}

.close {
    right: 35px;

    width: 65px;

    background:
        linear-gradient(
            #ee5d6b,
            #a91326
        );

    border-color: #ffaaaa;

    font-size: 34px;
}



.round {

    position: absolute;

    top: 17px;

    left: 50%;

    transform: translateX(-50%);

    font-size: 18px;

    text-shadow: 0 0 8px white;

    z-index: 10;
}



.bet {

    position: absolute;

    top: 70px;

    width: 300px;

    text-align: center;

    z-index: 10;
}

.bet-tai {
    left: 25px;
}

.bet-xiu {
    right: 25px;
}

.bet-title {

    font-size: 72px;

    line-height: 1;

    font-weight: 1000;
}

.bet-tai .bet-title {

    color: #ffd52b;

    text-shadow:
        0 0 5px white,
        0 0 15px #ffb000,
        0 0 30px #ff6100;
}

.bet-xiu .bet-title {

    color: #f5f0ff;

    text-shadow:
        0 0 5px white,
        0 0 15px #a66cff,
        0 0 30px #6730ff;
}

.players {

    margin-top: 2px;

    color: #eee8f5;

    font-size: 16px;
}

.my-money {

    margin-top: 12px;

    color: #ffd52b;

    font-size: 25px;

    font-weight: bold;

    text-shadow:
        0 0 10px #ff9d00;
}

.bet-button {

    width: 190px;
    height: 57px;

    margin-top: 14px;

    border-radius: 35px;

    border: 2px solid #82c0ff;

    background:
        linear-gradient(
            #5aa3ff,
            #1854df 60%,
            #082a91
        );

    color: white;

    font-size: 26px;

    font-weight: bold;

    box-shadow:
        0 0 10px #318fff,
        0 0 25px rgba(37,105,255,.55),
        inset 0 2px 4px rgba(255,255,255,.8);

    cursor: pointer;

    transition: .15s;
}

.bet-button:hover {

    transform: scale(1.04);

    filter: brightness(1.15);
}


/* =========================
   TIMER
========================= */

.timer {

    position: absolute;

    width: 280px;
    height: 280px;

    top: 55px;

    left: 50%;

    transform: translateX(-50%);

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #08000f 0 67%,
            transparent 68%
        );

    box-shadow:
        0 0 10px white,
        0 0 30px #9c50ff,
        0 0 65px rgba(112,43,255,.8);

    z-index: 8;
}

.timer::before {

    content: "";

    position: absolute;

    inset: 7px;

    border-radius: 50%;

    border: 5px solid #a85cff;

    box-shadow:
        inset 0 0 15px #8d3dff,
        0 0 12px #b65cff;
}

.timer::after {

    content: "";

    position: absolute;

    inset: 18px;

    border-radius: 50%;

    border: 2px solid rgba(255,255,255,.3);
}

.timer-number {

    position: relative;

    z-index: 5;

    font-size: 95px;

    font-weight: 900;

    color: #edfbff;

    text-shadow:
        0 0 5px white,
        0 0 15px #55c4ff,
        0 0 35px #218eff;
}


.sound {

    position: absolute;

    left: 50%;

    transform: translateX(107px);

    bottom: 150px;

    width: 54px;
    height: 54px;

    border-radius: 50%;

    border: 2px solid #c9baff;

    background: #10001f;

    color: white;

    font-size: 24px;

    box-shadow:
        0 0 15px #753dff;

    z-index: 15;

    cursor: pointer;
}



.percent {

    position: absolute;

    left: -43px;

    bottom: 185px;

    width: 80px;
    height: 80px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #6039ea,
            #1b0561
        );

    border: 3px solid #c4a4ff;

    color: white;

    font-size: 22px;

    font-weight: bold;

    box-shadow:
        0 0 18px #743dff;

    z-index: 15;
}


/* =========================
   CHIP PANEL
========================= */

.chip-panel {

    position: absolute;

    left: 50%;

    transform: translateX(-50%);

    bottom: 75px;

    width: 680px;

    min-height: 82px;

    padding: 8px 15px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 10px;

    border-radius: 45px;

    background:
        linear-gradient(
            90deg,
            rgba(21,0,45,.92),
            rgba(51,10,100,.95),
            rgba(21,0,45,.92)
        );

    border: 2px solid #8d61e9;

    box-shadow:
        0 0 18px rgba(105,42,220,.7),
        inset 0 0 20px rgba(118,43,255,.35);

    z-index: 20;
}

.chip-button {

    width: 62px;
    height: 62px;

    border-radius: 50%;

    position: relative;

    color: white;

    font-size: 13px;

    font-weight: 900;

    border: 5px dashed rgba(255,255,255,.9);

    cursor: pointer;

    box-shadow:
        0 5px 10px rgba(0,0,0,.7),
        inset 0 0 9px rgba(255,255,255,.5);

    transition: .15s;
}

.chip-button::after {

    content: "";

    position: absolute;

    left: 8px;
    top: 8px;

    width: 36px;
    height: 36px;

    border-radius: 50%;

    border: 2px solid rgba(255,255,255,.7);

    pointer-events: none;
}

.chip-button:hover {

    transform: translateY(-5px) scale(1.05);

    filter: brightness(1.2);
}

.chip-button.selected {

    transform: translateY(-7px) scale(1.1);

    box-shadow:
        0 0 10px white,
        0 0 22px #ffe65c,
        0 8px 15px rgba(0,0,0,.7);
}

.chip-1k {
    background: radial-gradient(circle,#ffef4d,#d87900);
}

.chip-5k {
    background: radial-gradient(circle,#65dfff,#006bb7);
}

.chip-10k {
    background: radial-gradient(circle,#ff72e9,#8c168e);
}

.chip-50k {
    background: radial-gradient(circle,#65e875,#07852c);
}

.chip-100k {
    background: radial-gradient(circle,#eeeeee,#777777);
}

.chip-200k {
    background: radial-gradient(circle,#ff704e,#9e1c08);
}

.chip-500k {
    background: radial-gradient(circle,#b98aff,#4b16a5);
}

.chip-1m {
    background: radial-gradient(circle,#ffe77a,#a86a00);
}


/* =========================
   X2
========================= */

.double-button {

    width: 58px;
    height: 58px;

    border-radius: 50%;

    border: 3px solid #e7c65a;

    background:
        linear-gradient(
            #d9a71d,
            #7e4300
        );

    color: white;

    font-size: 17px;

    font-weight: 900;

    cursor: pointer;

    box-shadow:
        0 0 12px #ffbd20;
}

.double-button:hover {

    transform: scale(1.08);
}


/* =========================
   TỔNG ĐANG CHỌN
========================= */

.selected-money {

    position: absolute;

    left: 50%;

    transform: translateX(-50%);

    bottom: 15px;

    min-width: 250px;

    padding: 6px 20px;

    border-radius: 25px;

    text-align: center;

    color: #d8c7ec;

    font-size: 13px;

    z-index: 20;
}

.selected-money strong {

    color: #ffd52b;

    font-size: 18px;
}



.history {

    position: absolute;

    left: 48px;
    right: 48px;

    bottom: -28px;

    height: 57px;

    padding-left: 67px;
    padding-right: 15px;

    display: flex;
    align-items: center;

    gap: 13px;

    border-radius: 32px;

    background:
        linear-gradient(
            90deg,
            #18002f,
            #2c0762
        );

    border: 3px solid #9f77ff;

    box-shadow:
        0 0 15px #6935dc,
        inset 0 0 20px rgba(101,39,255,.4);

    z-index: 30;

    overflow: hidden;
}

.history-icon {

    position: absolute;

    left: -4px;

    width: 66px;
    height: 66px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 20px;

    background:
        linear-gradient(
            135deg,
            #e954db,
            #6819ed
        );

    border: 2px solid #ffbaff;

    box-shadow:
        0 0 15px #c23cff;

    font-size: 28px;
}

.history-dot {

    width: 29px;
    height: 29px;

    min-width: 29px;

    border-radius: 50%;

    border: 2px solid white;

    box-shadow:
        0 0 8px currentColor;
}

.history-dot.tai {

    background: #ffad00;

    color: #ffad00;
}

.history-dot.xiu {

    background: #f2efff;

    color: #f2efff;
}



.result {

    position: absolute;

    left: 50%;

    transform: translateX(-50%);

    bottom: 222px;

    width: 260px;

    text-align: center;

    color: #ffd52b;

    font-weight: bold;

    text-shadow:
        0 0 10px #ff9c00;

    z-index: 20;
}

.result small {

    display: block;

    color: #a99aba;

    font-size: 10px;

    margin-bottom: 3px;
}



.status {

    position: absolute;

    left: 50%;

    transform: translateX(-50%);

    bottom: 200px;

    color: #cdbfe1;

    font-size: 11px;

    white-space: nowrap;

    z-index: 20;
}



@media(max-width: 1050px) {

    .notice {
        display: none;
    }

    .decor-chips {
        display: none;
    }

    .game {
        width: 94vw;
    }
}

@media(max-width: 760px) {

    .header {
        height: 65px;
        padding: 0 8px;
    }

    .logo {
        width: 115px;
        font-size: 20px;
    }

    .logo span {
        font-size: 8px;
    }

    .username {
        display: none;
    }

    .balance {
        min-width: 140px;
    }

    .main {
        padding-top: 60px;
    }

    .game {
        width: 96vw;
        height: 560px;
        border-radius: 52px;
    }

    .game::before {
        border-radius: 44px;
    }

    .bet {
        width: 32%;
        top: 85px;
    }

    .bet-tai {
        left: 3px;
    }

    .bet-xiu {
        right: 3px;
    }

    .bet-title {
        font-size: 40px;
    }

    .players {
        font-size: 10px;
    }

    .my-money {
        font-size: 14px;
    }

    .bet-button {
        width: 100px;
        height: 42px;
        font-size: 17px;
    }

    .timer {
        width: 205px;
        height: 205px;
        top: 100px;
    }

    .timer-number {
        font-size: 65px;
    }

    .chip-panel {
        width: 92%;
        gap: 4px;
        padding: 7px;
    }

    .chip-button {
        width: 43px;
        height: 43px;
        font-size: 9px;
        border-width: 3px;
    }

    .chip-button::after {
        width: 26px;
        height: 26px;
        left: 5px;
        top: 5px;
    }

    .double-button {
        width: 42px;
        height: 42px;
        font-size: 13px;
    }

    .history {
        left: 18px;
        right: 18px;
    }

    .history-dot:nth-of-type(n+9) {
        display: none;
    }

    .percent {
        left: -10px;
        width: 60px;
        height: 60px;
        font-size: 16px;
    }

    .top-button {
        width: 48px;
        height: 44px;
        font-size: 23px;
    }

    .question {
        left: 3px;
    }

    .trophy {
        left: 20%;
    }

    .history-button {
        right: 20%;
    }

    .close {
        right: 4px;
        width: 52px;
    }

}

</style>
</head>

<header class="header">

    <div class="logo">

        <span>
            HAYWIN
        </span>

    </div>


    <div class="notice">

        <br>

        Người chơi

    </div>


    <div class="account">

        <div class="avatar">

        </div>

<main class="main">

    </div>

    </div>

</div>


<div class="decor-chips decor-right">

    <div class="decor-chip">
        100
    </div>

    <div class="decor-chip">
        250
    </div>

    <div class="decor-chip">
        500
    </div>

</div>



<section class="game">




<div class="top-buttons">

    <button class="top-button question">
        ?
    </button>

    <button class="top-button trophy">
        🏆
    </button>

    <button class="top-button history-button">
        ↶
    </button>

    <button class="top-button close">
        ×
    </button>

</div>



<div class="round">

    #<span id="round">
        8
    </span>

</div>



<div class="bet bet-tai">

    <div class="bet-title">
        TÀI
    </div>

    <div class="players">
        👤 1 người chơi

    <div

        class="bet-button"

<div class="bet bet-xiu">

    <div class="bet-title">
        XỈU
    </div>

    <div class="players">

    </div>

    <div
        class="my-money"
        id="xiuAmount">

        0

    </div>

    <button
        class="bet-button"
        onclick="placeBet('xiu')">

        ĐẶT

    </button>

</div>



<div class="timer">

    <div
        class="timer-number"
        id="timer">

        30

    </div>

</div>


<button
    class="sound"
    onclick="toggleSound()">

    🔇

</button>



<!-- 250% -->

    250%

</div>

    <small>
        KẾT QUẢ
    </small>

    <span id="result">
        Chờ kết quả...
    </span>

</div>

    Chọn chip để bắt đầu.

</div>




<div class="chip-panel">


    <button
        class="chip-button chip-1k"
        onclick="addChip(1000, this)">

        1K

    </button>


    <button
        class="chip-button chip-5k"
        onclick="addChip(5000, this)">

        5K

    </button>


    <button
        class="chip-button chip-10k"
        onclick="addChip(10000, this)">

        10K

    </button>


    <button
        class="chip-button chip-50k"
        onclick="addChip(50000, this)">

        50K

    </button>


    <button
        class="chip-button chip-100k"
        onclick="addChip(100000, this)">

        100K

    </button>


    <button
        class="chip-button chip-200k"
        onclick="addChip(200000, this)">

        200K

    </button>


    <button
        class="chip-button chip-500k"
        onclick="addChip(500000, this)">

        500K

    </button>


    <button
        class="chip-button chip-1m"
        onclick="addChip(1000000, this)">

        1M

    </button>


    <button
        class="double-button"
        onclick="doubleChip()">

        ×2

    </button>


</div>



<div class="selected-money">

    Đang chọn:

    <strong id="selectedAmount">
        0
    </strong>

</div>




<div class="history">

    <div class="history-icon">
        📈
    </div>

    <div class="history-dot tai"></div>
    <div class="history-dot xiu"></div>
    <div class="history-dot tai"></div>
    <div class="history-dot tai"></div>
    <div class="history-dot xiu"></div>
    <div class="history-dot tai"></div>
    <div class="history-dot tai"></div>
    <div class="history-dot xiu"></div>
    <div class="history-dot tai"></div>
    <div class="history-dot xiu"></div>

</div>


</section>

</main>



<script>



let selectedAmount = 0;

let taiAmount = 0;

let xiuAmount = 0;

let round = 2340960;

let time = 30;

let gameRunning = true;

let soundOn = false;

let timerInterval;



const selectedElement =
    document.getElementById(
        "selectedAmount"
    );

const taiElement =
    document.getElementById(
        "taiAmount"
    );

const xiuElement =
    document.getElementById(
        "xiuAmount"
    );

const timerElement =
    document.getElementById(
        "timer"
    );

const roundElement =
    document.getElementById(
        "round"
    );

const resultElement =
    document.getElementById(
        "result"
    );

const statusElement =
    document.getElementById(
        "status"
    );


function formatNumber(number) {

    if (number >= 1000000) {

        return (
            number / 1000000
        ).toLocaleString(
            "vi-VN",
            {
                maximumFractionDigits: 2
            }
        ) + "M";

    }

    if (number >= 1000) {

        return (
            number / 1000
        ).toLocaleString(
            "vi-VN",
            {
                maximumFractionDigits: 2
            }
        ) + "K";

    }

    return number.toLocaleString(
        "vi-VN"
    );
}



function updateSelected() {

    selectedElement.textContent =
        formatNumber(selectedAmount);

}

function updateBets() {

    taiElement.textContent =
        formatNumber(taiAmount);

    xiuElement.textContent =
        formatNumber(xiuAmount);

}



function addChip(amount, button) {

    if (!gameRunning) {
        return;
    }

    selectedAmount += amount;

    updateSelected();

    document
        .querySelectorAll(".chip-button")
        .forEach(chip => {

            chip.classList.remove(
                "selected"
            );

        });

    button.classList.add(
        "selected"
    );

    statusElement.textContent =
        "Đang chọn " +
        formatNumber(selectedAmount) +
        " điểm demo.";

}


function doubleChip() {

    if (!gameRunning) {
        return;
    }

    if (selectedAmount <= 0) {

        statusElement.textContent =
            "Hãy chọn chip trước.";

        return;
    }

    selectedAmount *= 2;

    updateSelected();

    statusElement.textContent =
        "Đã nhân đôi thành " +
        formatNumber(selectedAmount) +
        " điểm demo.";

}



function placeBet(side) {

    if (!gameRunning) {
        return;
    }

    if (selectedAmount <= 0) {

        statusElement.textContent =
            "Bạn chưa chọn chip.";

        return;
    }


    if (side === "tai") {

        taiAmount += selectedAmount;

        statusElement.textContent =
            "Đã thêm " +
            formatNumber(selectedAmount) +
            " điểm vào TÀI.";

    }


    if (side === "xiu") {

        xiuAmount += selectedAmount;

        statusElement.textContent =
            "Đã thêm " +
            formatNumber(selectedAmount) +
            " điểm vào XỈU.";

    }


    selectedAmount = 0;

    updateSelected();

    updateBets();


    document
        .querySelectorAll(".chip-button")
        .forEach(chip => {

            chip.classList.remove(
                "selected"
            );

        });

}


function startTimer() {

    clearInterval(timerInterval);

    time = 30;

    gameRunning = true;

    timerElement.textContent =
        time;

    timerInterval =
        setInterval(() => {

            time--;

            timerElement.textContent =
                time;

            if (time <= 0) {

                clearInterval(
                    timerInterval
                );

                finishRound();

            }

        }, 1000);

}


function finishRound() {

    gameRunning = false;

    selectedAmount = 0;

    updateSelected();

    document
        .querySelectorAll(".chip-button")
        .forEach(chip => {

            chip.classList.remove(
                "selected"
            );

        });


    statusElement.textContent =
        "Phiên đã kết thúc.";


    const dice1 =
        Math.floor(
            Math.random() * 6
        ) + 1;

    const dice2 =
        Math.floor(
            Math.random() * 6
        ) + 1;

    const dice3 =
        Math.floor(
            Math.random() * 6
        ) + 1;

    const total =
        dice1 +
        dice2 +
        dice3;


    const result =
        total >= 11
            ? "TÀI"
            : "XỈU";


    resultElement.textContent =
        result +
        " - " +
        total +
        " điểm";


    addHistory(result);


    setTimeout(() => {

        round++;

        roundElement.textContent =
            round;

        resultElement.textContent =
            "Chờ kết quả...";

        taiAmount = 0;

        xiuAmount = 0;

        updateBets();

        statusElement.textContent =
            "Phiên mới bắt đầu.";

        startTimer();

    }, 3000);

}


function addHistory(result) {

    const history =
        document.querySelector(
            ".history"
        );

    const dot =
        document.createElement(
            "div"
        );

    dot.className =
        "history-dot " +
        (
            result === "TÀI"
                ? "tai"
                : "xiu"
        );

    history.appendChild(dot);


    const dots =
        history.querySelectorAll(
            ".history-dot"
        );


    if (dots.length > 10) {

        dots[0].remove();

    }

}



function toggleSound() {

    soundOn = !soundOn;

    document.querySelector(
        ".sound"
    ).textContent =
        soundOn
            ? "🔊"
            : "🔇";

}



updateSelected();

updateBets();

startTimer();

</script>

</body>
</html>
