<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tài Xỉu Online</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 50% 20%, #3d087d 0%, transparent 35%),
        radial-gradient(circle at 20% 80%, #101d65 0%, transparent 30%),
        linear-gradient(135deg, #05000d, #120021, #04000b);
}

.header {
    height: 85px;
    padding: 0 35px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #6d29ff;
    background: rgba(8, 0, 20, .92);
    box-shadow: 0 0 25px #4e16b8;
}

.logo {
    font-size: 30px;
    font-weight: 900;
    color: #ffd632;
    text-shadow:
        0 0 8px #ff9900,
        0 0 20px #ff5e00;
}

.logo span {
    color: white;
}

.player {
    display: flex;
    align-items: center;
    gap: 15px;
}

.avatar {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    background: linear-gradient(135deg, #8d45ff, #240052);
    border: 2px solid #9d6aff;
    box-shadow: 0 0 15px #7430ff;
}

.player-info strong {
    display: block;
    font-size: 17px;
}

.player-info span {
    color: #ffd72d;
    font-size: 13px;
}

.balance {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-radius: 25px;
    background: linear-gradient(90deg, #211047, #43139b);
    border: 1px solid #8e5cff;
    box-shadow: 0 0 15px #5b24c7;
}

.coin {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle, #fff2a0, #ff9c00);
    color: #7a3500;
}

.balance b {
    color: #ffd735;
}

.plus {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 0;
    color: white;
    font-size: 20px;
    background: #5520d8;
    cursor: pointer;
}

.container {
    width: min(1250px, 95%);
    margin: 30px auto;
}

.game {
    position: relative;
    min-height: 610px;
    overflow: hidden;
    border-radius: 35px;
    border: 2px solid #7d42ff;
    background:
        radial-gradient(circle at 50% 50%, #4515a3, transparent 55%),
        linear-gradient(150deg, #19002f, #35006e, #120024);
    box-shadow:
        0 0 20px #702cff,
        inset 0 0 70px rgba(105, 35, 255, .45);
}

.game-header {
    height: 65px;
    padding: 0 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.round {
    color: #d9c9ff;
    font-size: 16px;
}

.round b {
    color: white;
}

.small-btn {
    width: 45px;
    height: 45px;
    border-radius: 13px;
    border: 1px solid #8057ff;
    color: white;
    background: linear-gradient(#4d1bc4, #21056d);
    font-size: 23px;
    cursor: pointer;
    box-shadow: 0 0 15px #5723dc;
}

.small-btn:hover {
    transform: scale(1.08);
}

.bet-layout {
    display: grid;
    grid-template-columns: 1fr 280px 1fr;
    align-items: center;
    gap: 10px;
    padding: 15px 35px;
}

.bet-side {
    text-align: center;
}

.bet-title {
    font-size: clamp(55px, 7vw, 90px);
    font-weight: 1000;
    line-height: 1;
}

.tai {
    color: #ffd42c;
    text-shadow:
        0 0 5px white,
        0 0 15px #ffae00,
        0 0 35px #ff5500;
}

.xiu {
    color: #eee9ff;
    text-shadow:
        0 0 5px white,
        0 0 15px #9369ff,
        0 0 35px #632cff;
}

.people {
    margin: 8px 0;
    color: #e9dfff;
    font-size: 14px;
}

.money {
    color: #ffd72e;
    font-size: 25px;
    font-weight: bold;
    text-shadow: 0 0 10px #ff9d00;
}

.bet-button {
    margin-top: 15px;
    width: 180px;
    padding: 13px;
    border: 0;
    border-radius: 30px;
    color: white;
    font-size: 21px;
    font-weight: bold;
    cursor: pointer;
    background: linear-gradient(#397eff, #3013ca);
    border: 2px solid #72a1ff;
    box-shadow:
        0 0 10px #318aff,
        inset 0 2px rgba(255,255,255,.7);
}

.bet-button:hover:not(:disabled) {
    transform: scale(1.05);
    filter: brightness(1.15);
}

.bet-button:disabled {
    opacity: .4;
    cursor: not-allowed;
}

.timer-box {
    display: flex;
    justify-content: center;
}

.timer {
    width: 250px;
    height: 250px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    border-radius: 50%;
    background:
        radial-gradient(circle, #11001f 59%, transparent 60%),
        conic-gradient(#8138ff var(--progress), #32105d 0);
    box-shadow:
        0 0 15px #9b5cff,
        0 0 40px rgba(119, 44, 255, .7);
}

.timer::before {
    content: "";
    position: absolute;
    inset: 9px;
    border-radius: 50%;
    border: 2px solid #a36cff;
}

.timer-number {
    position: relative;
    z-index: 2;
    font-size: 75px;
    font-weight: 900;
    color: #e9e0ff;
    text-shadow:
        0 0 10px white,
        0 0 25px #4f9fff;
}

.dice-area {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-top: 15px;
}

.dice {
    width: 78px;
    height: 78px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 17px;
    background: linear-gradient(135deg, #ffffff, #c9bdff);
    border: 3px solid #9d79ff;
    color: #270052;
    font-size: 43px;
    box-shadow:
        0 0 10px white,
        0 0 25px #7734ff;
}

.dice.rolling {
    animation: shake .12s infinite;
}

@keyframes shake {
    0% {
        transform: rotate(-8deg) translateX(-3px);
    }

    50% {
        transform: rotate(8deg) translateX(3px);
    }

    100% {
        transform: rotate(-8deg) translateX(-3px);
    }
}

.result {
    text-align: center;
    margin-top: 15px;
}

.result-title {
    color: #a995ca;
    font-size: 13px;
}

.result-value {
    margin-top: 4px;
    color: #ffd62d;
    font-size: 25px;
    font-weight: bold;
    text-shadow: 0 0 12px #ff9d00;
}

.status {
    min-height: 22px;
    text-align: center;
    margin-top: 5px;
    color: #bdeaff;
    font-size: 14px;
}

.history {
    margin: 22px 30px;
    padding: 15px 20px;
    border-radius: 20px;
    background: rgba(7, 0, 24, .75);
    border: 1px solid #6538bc;
    box-shadow: inset 0 0 25px rgba(95, 28, 255, .25);
}

.history-title {
    margin-bottom: 10px;
    color: #c9b7ea;
    font-size: 13px;
}

.history-list {
    display: flex;
    gap: 10px;
    overflow-x: auto;
}

.history-dot {
    min-width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    border: 2px solid white;
}

.history-dot.tai {
    background: #ff9f00;
}

.history-dot.xiu {
    background: #6d35ff;
}

.info {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-top: 20px;
}

.info-card {
    padding: 17px;
    text-align: center;
    border-radius: 17px;
    background: rgba(24, 4, 50, .85);
    border: 1px solid #5425a7;
    box-shadow: 0 0 15px rgba(86, 35, 180, .3);
}

.info-card span {
    display: block;
    margin-bottom: 7px;
    color: #9c89bb;
    font-size: 12px;
}

.info-card strong {
    color: #ffd72e;
    font-size: 17px;
}

.chips {
    margin-top: 20px;
    padding: 18px 22px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(12, 0, 29, .9);
    border: 1px solid #6128c4;
}

.chips-title {
    margin-right: 10px;
    color: #d3c3ef;
    font-weight: bold;
}

.chip {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: 4px dashed rgba(255,255,255,.8);
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 12px currentColor;
    transition: .2s;
}

.chip:hover {
    transform: translateY(-5px) scale(1.05);
}

.chip:nth-child(2) {
    background: #174c9d;
}

.chip:nth-child(3) {
    background: #6324a5;
}

.chip:nth-child(4) {
    background: #8f242c;
}

.chip:nth-child(5) {
    background: #a15a1b;
}

.chip:nth-child(6) {
    background: #32842c;
}

.chip:nth-child(7) {
    background: #555;
}

.selected {
    outline: 3px solid white;
    transform: translateY(-5px);
}

.popup {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(.8);
    width: min(400px, 90%);
    padding: 30px;
    text-align: center;
    border-radius: 25px;
    background: linear-gradient(150deg, #29005d, #0b0019);
    border: 2px solid #8b5aff;
    box-shadow: 0 0 40px #7134ff;
    opacity: 0;
    pointer-events: none;
    transition: .25s;
    z-index: 99;
}

.popup.show {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, -50%) scale(1);
}

.popup h2 {
    color: #ffd52e;
    margin-bottom: 12px;
}

.popup p {
    color: #ddd2f3;
    line-height: 1.5;
}

.popup button {
    margin-top: 20px;
    padding: 10px 25px;
    border: 0;
    border-radius: 20px;
    color: white;
    background: #632cff;
    cursor: pointer;
}

@media(max-width: 850px) {
    .header {
        padding: 0 15px;
    }

    .player {
        display: none;
    }

    .bet-layout {
        grid-template-columns: 1fr 1fr;
        grid-template-areas:
            "tai xiu"
            "timer timer";
    }

    .bet-side:first-child {
        grid-area: tai;
    }

    .bet-side:last-child {
        grid-area: xiu;
    }

    .timer-box {
        grid-area: timer;
        margin-top: 20px;
    }

    .info {
        grid-template-columns: 1fr;
    }

    .chips {
        overflow-x: auto;
    }
}

@media(max-width: 550px) {
    .logo {
        font-size: 20px;
    }

    .balance {
        padding: 7px 10px;
        font-size: 12px;
    }

    .bet-title {
        font-size: 45px;
    }

    .money {
        font-size: 18px;
    }

    .bet-button {
        width: 125px;
        font-size: 16px;
    }

    .timer {
        width: 190px;
        height: 190px;
    }

    .timer-number {
        font-size: 58px;
    }

    .dice {
        width: 60px;
        height: 60px;
        font-size: 32px;
    }

    .game {
        border-radius: 20px;
    }

    .history {
        margin: 15px;
    }
}
</style>
</head>

<script>
const diceSymbols = [
    "⚀",
    "⚁",
    "⚂",
    "⚃",
    "⚄",
    "⚅"
];

let balance = 1000000;
let round = 2340960;
let time = 30;

let selectedBet = null;
let selectedChip = 10000;

let isRolling = false;

let timerInterval;
let diceInterval;

const timer = document.getElementById("timer");
const timerNumber = document.getElementById("timerNumber");

const balanceElement =
    document.getElementById("balance");

const roundElement =
    document.getElementById("round");

const roundInfo =
    document.getElementById("roundInfo");

const taiButton =
    document.getElementById("taiButton");

const xiuButton =
    document.getElementById("xiuButton");

const status =
    document.getElementById("status");

const gameStatus =
    document.getElementById("gameStatus");

const result =
    document.getElementById("result");

function updateBalance() {

    balanceElement.textContent =
        balance.toLocaleString("en-US");
}

function updateRound() {

    roundElement.textContent =
        round;

    roundInfo.textContent =
        "#" + round;
}

function updateTimer() {

    timerNumber.textContent =
        time;

    const progress =
        (time / 30) * 100;

    timer.style.setProperty(
        "--progress",
        progress + "%"
    );
}

function enableButtons(value) {

    taiButton.disabled = !value;
    xiuButton.disabled = !value;
}

function startTimer() {

    clearInterval(timerInterval);

    time = 30;

    isRolling = false;

    enableButtons(true);

    gameStatus.textContent =
        "ĐANG HOẠT ĐỘNG";

    status.textContent =
        "";

    updateTimer();

    timerInterval =
        setInterval(() => {

            time--;

            updateTimer();

            if (time <= 0) {

                clearInterval(timerInterval);

                startRolling();

            }

        }, 1000);
}

function startRolling() {

    isRolling = true;

    enableButtons(false);

    gameStatus.textContent =
        "ĐANG LẮC XÚC XẮC";

    status.textContent =
        "Đang lắc xúc xắc...";

    const dice = [
        document.getElementById("dice1"),
        document.getElementById("dice2"),
        document.getElementById("dice3")
    ];

    dice.forEach(item => {
        item.classList.add("rolling");
    });

    let elapsed = 0;

    diceInterval =
        setInterval(() => {

            dice.forEach(item => {

                const value =
                    Math.floor(Math.random() * 6);

                item.textContent =
                    diceSymbols[value];

            });

            elapsed += 100;

            if (elapsed >= 1500) {

                clearInterval(diceInterval);

                dice.forEach(item => {
                    item.classList.remove("rolling");
                });

                finishRolling();

            }

        }, 100);
}

function finishRolling() {

    const values = [
        Math.floor(Math.random() * 6) + 1,
        Math.floor(Math.random() * 6) + 1,
        Math.floor(Math.random() * 6) + 1
    ];

    document.getElementById("dice1").textContent =
        diceSymbols[values[0] - 1];

    document.getElementById("dice2").textContent =
        diceSymbols[values[1] - 1];

    document.getElementById("dice3").textContent =
        diceSymbols[values[2] - 1];

    const total =
        values[0] +
        values[1] +
        values[2];

    const gameResult =
        total >= 11 ? "TÀI" : "XỈU";

    result.textContent =
        gameResult + " - " + total + " điểm";

    addHistory(gameResult);

    if (selectedBet !== null) {

        if (selectedBet === gameResult) {

            balance += selectedChip;

            showPopup(
                "🎉 THẮNG",
                "Bạn thắng " +
                selectedChip.toLocaleString("en-US") +
                " xu demo."
            );

        } else {

            balance -= selectedChip;

            if (balance < 0) {
                balance = 0;
            }

            showPopup(
                "KẾT QUẢ",
                "Bạn đã chọn " +
                selectedBet +
                ". Kết quả là " +
                gameResult +
                "."
            );
        }

        updateBalance();
    }

    selectedBet = null;

    isRolling = false;

    gameStatus.textContent =
        "KẾT THÚC PHIÊN";

    status.textContent =
        "Phiên mới sẽ bắt đầu sau 3 giây.";

    setTimeout(() => {

        round++;

        updateRound();

        result.textContent =
            "Chờ phiên mới...";

        startTimer();

    }, 3000);
}

function placeBet(type) {

    if (isRolling) {
        return;
    }

    if (selectedChip > balance) {

        showPopup(
            "KHÔNG ĐỦ XU",
            "Bạn không đủ xu, vui lòng nạp thêm."
        );

        return;
    }

    selectedBet = type;

    status.textContent =
        "Đã chọn " +
        type +
        " - cược " +
        selectedChip.toLocaleString("en-US") +
        " xu.";

    showPopup(
        "ĐẶT CỬA",
        "Bạn đã chọn " +
        type +
        " với " +
        selectedChip.toLocaleString("en-US") +
        " xu demo."
    );
}

function selectChip(element, amount) {

    document
        .querySelectorAll(".chip")
        .forEach(chip => {
            chip.classList.remove("selected");
        });

    element.classList.add("selected");

    selectedChip = amount;

    status.textContent =
        "Đã chọn chip " +
        amount.toLocaleString("en-US") +
        " xu.";
}

function addHistory(value) {

    const history =
        document.getElementById("history");

    const item =
        document.createElement("div");

    item.className =
        "history-dot " +
        (value === "TÀI" ? "tai" : "xiu");

    item.textContent =
        value === "TÀI" ? "T" : "X";

    history.prepend(item);

    if (history.children.length > 20) {
        history.lastElementChild.remove();
    }
}

function showPopup(title, text) {

    document.getElementById("popupTitle")
        .textContent = title;

    document.getElementById("popupText")
        .textContent = text;

    document.getElementById("popup")
        .classList.add("show");
}

function closePopup() {

    document.getElementById("popup")
        .classList.remove("show");
}


updateBalance();
updateRound();
startTimer();
