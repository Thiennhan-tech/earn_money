<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhân Bet 88</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b021a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            width: 1000px;
            height: 580px;
            background: radial-gradient(circle, #2a085c 0%, #0d0122 100%);
            border: 2px solid #522785;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(118, 43, 206, 0.4);
            display: flex;
            flex-direction: column;
            position: relative;
            padding: 10px 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 50px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo-title {
            font-size: 20px;
            font-weight: 900;
            color: #ffcc00;
            text-shadow: 0 0 10px #ff6600;
            font-style: italic;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .balance-box {
            background: #000;
            border: 2px solid #ffcc00;
            border-radius: 20px;
            padding: 4px 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffcc00;
            font-weight: bold;
            font-size: 16px;
            box-shadow: inset 0 0 5px rgba(255,204,0,0.5);
        }

        .main-board {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .board-frame {
            width: 750px;
            height: 320px;
            background: linear-gradient(180deg, #1f0a46 0%, #0a011a 100%);
            border: 4px solid #7b3fe4;
            border-radius: 120px;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            box-shadow: inset 0 0 20px #000, 0 0 15px rgba(123, 63, 228, 0.5);
        }

        .side-bet {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 200px;
            z-index: 2;
        }

        .bet-title {
            font-size: 42px;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            letter-spacing: 2px;
        }

        .bet-title.tai { color: #ffcc00; text-shadow: 0 0 10px #ff6600; }
        .bet-title.xiu { color: #ffffff; text-shadow: 0 0 10px #00ccff; }

        .bet-staked {
            font-size: 18px;
            color: #00ffcc;
            margin: 5px 0;
            font-weight: bold;
            height: 25px;
        }

        .btn-bet {
            background: linear-gradient(180deg, #28a745 0%, #155724 100%);
            border: 2px solid #28a745;
            color: white;
            font-weight: bold;
            padding: 10px 30px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.1s;
        }

        .btn-bet:active {
            transform: scale(0.95);
        }

        .btn-bet:disabled {
            background: #555;
            border-color: #444;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .center-plate {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #111 60%, #333 100%);
            border: 6px solid #ffcc00;
            border-radius: 50%;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            z-index: 3;
        }

        .timer-display {
            font-size: 70px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 15px #00d2ff;
        }

        .dice-container {
            display: none;
            gap: 10px;
        }

        .dice {
            width: 40px;
            height: 40px;
            background-color: white;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 22px;
            color: #000;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        }

        .dice.red-dot {
            color: red;
        }

        .history-bar {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            background: rgba(0,0,0,0.6);
            padding: 6px 15px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .history-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            font-weight: bold;
        }

        .dot-tai { background: #ffcc00; color: #000; }
        .dot-xiu { background: #fff; color: #000; }

        .control-panel {
            height: 120px;
            background: rgba(0,0,0,0.4);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .chips-selector {
            display: flex;
            gap: 10px;
        }

        .chip {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 4px dashed #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }

        .chip:hover { transform: translateY(-3px); }
        .chip.active { transform: translateY(-8px); border-style: solid; border-color: #ffcc00; }

        .chip-1k { background: #3498db; }
        .chip-5k { background: #2ecc71; }
        .chip-10k { background: #e67e22; }
        .chip-50k { background: #9b59b6; }
        .chip-100k { background: #e74c3c; }
        .chip-200k { background: #1abc9c; }
        .chip-500k { background: #d35400; }
        .chip-1m { background: #f1c40f; color: #000; }

        .action-btns {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            background: linear-gradient(180deg, #6f42c1 0%, #4c288d 100%);
            border: 1px solid #8c5ada;
            color: white;
            font-weight: bold;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-action:active { transform: scale(0.95); }
        .btn-action:disabled { opacity: 0.5; cursor: not-allowed; }

        .status-msg {
            position: absolute;
            top: 65px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: #00ffcc;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <div class="logo-title">TÀI XỈU ONLINE</div>
        <div class="user-info">
            <div class="balance-box">
                <span>$</span>
                <span id="balance">1,000,000</span>
            </div>
        </div>
    </div>

    <div class="status-msg" id="status-msg">CHỌN CỬA VÀ ĐẶT CƯỢC</div>

    <div class="main-board">
        <div class="board-frame">
            <div class="side-bet">
                <div class="bet-title tai">TÀI</div>
                <div style="font-size: 12px; color: #aaa;">11 - 17</div>
                <div class="bet-staked" id="staked-tai">0</div>
                <button class="btn-bet" id="btn-bet-tai" onclick="placeBet('TAI')">ĐẶT TÀI</button>
            </div>

            <div class="center-plate">
                <div class="timer-display" id="timer">30</div>
                <div class="dice-container" id="dice-container">
                    <div class="dice" id="dice1">1</div>
                    <div class="dice" id="dice2">1</div>
                    <div class="dice" id="dice3">1</div>
                </div>
            </div>

            <div class="side-bet">
                <div class="bet-title xiu">XỈU</div>
                <div style="font-size: 12px; color: #aaa;">3 - 10</div>
                <div class="bet-staked" id="staked-xiu">0</div>
                <button class="btn-bet" id="btn-bet-xiu" onclick="placeBet('XIU')">ĐẶT XỈU</button>
            </div>

            <div class="history-bar" id="history-bar"></div>
        </div>
    </div>

    <div class="control-panel">
        <div class="chips-selector">
            <div class="chip chip-1k active" onclick="selectChip(1000, this)">1K</div>
            <div class="chip chip-5k" onclick="selectChip(5000, this)">5K</div>
            <div class="chip chip-10k" onclick="selectChip(10000, this)">10K</div>
            <div class="chip chip-50k" onclick="selectChip(50000, this)">50K</div>
            <div class="chip chip-100k" onclick="selectChip(100000, this)">100K</div>
            <div class="chip chip-200k" onclick="selectChip(200000, this)">200K</div>
            <div class="chip chip-500k" onclick="selectChip(500000, this)">500K</div>
            <div class="chip chip-1m" onclick="selectChip(1000000, this)">1M</div>
        </div>

        <div class="action-btns">
            <button class="btn-action" id="btn-x2" onclick="doubleBet()">X2 CƯỢC</button>
        </div>
    </div>
</div>

<script>
    let balance = 1000000;
    let selectedChip = 1000;
    let currentBetSide = null;
    let betTai = 0;
    let betXiu = 0;
    let timeLeft = 30;
    let timerInterval = null;
    let isLocked = false;
    let history = [];

    const balanceEl = document.getElementById('balance');
    const timerEl = document.getElementById('timer');
    const diceContainer = document.getElementById('dice-container');
    const stakedTaiEl = document.getElementById('staked-tai');
    const stakedXiuEl = document.getElementById('staked-xiu');
    const btnBetTai = document.getElementById('btn-bet-tai');
    const btnBetXiu = document.getElementById('btn-bet-xiu');
    const btnX2 = document.getElementById('btn-x2');
    const statusMsg = document.getElementById('status-msg');
    const historyBar = document.getElementById('history-bar');

    function formatMoney(amount) {
        return amount.toLocaleString('en-US');
    }

    function updateUI() {
        balanceEl.innerText = formatMoney(balance);
        stakedTaiEl.innerText = formatMoney(betTai);
        stakedXiuEl.innerText = formatMoney(betXiu);
    }

    function selectChip(value, el) {
        selectedChip = value;
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
    }

    function placeBet(side) {
        if (isLocked) return;

        if (currentBetSide && currentBetSide !== side) {
            statusMsg.innerText = "CHỈ ĐƯỢC ĐẶT MỘT CỬA TRONG MỘT LƯỢT!";
            return;
        }

        if (balance < selectedChip) {
            statusMsg.innerText = "SỐ DƯ KHÔNG ĐỦ!";
            return;
        }

        balance -= selectedChip;
        currentBetSide = side;

        if (side === 'TAI') {
            betTai += selectedChip;
            btnBetXiu.disabled = true;
        } else {
            betXiu += selectedChip;
            btnBetTai.disabled = true;
        }

        statusMsg.innerText = "ĐẶT CƯỢC THÀNH CÔNG!";
        updateUI();
    }

    function doubleBet() {
        if (isLocked || !currentBetSide) return;

        let currentAmount = currentBetSide === 'TAI' ? betTai : betXiu;
        if (currentAmount === 0) return;

        if (balance < currentAmount) {
            statusMsg.innerText = "SỐ DƯ KHÔNG ĐỦ ĐỂ X2!";
            return;
        }

        balance -= currentAmount;
        if (currentBetSide === 'TAI') {
            betTai += currentAmount;
        } else {
            betXiu += currentAmount;
        }

        statusMsg.innerText = "NHÂN ĐÔI MỨC CƯỢC THÀNH CÔNG!";
        updateUI();
    }

    function startTimer() {
        timeLeft = 30;
        isLocked = false;
        timerEl.style.display = 'block';
        diceContainer.style.display = 'none';
        btnBetTai.disabled = false;
        btnBetXiu.disabled = false;
        btnX2.disabled = false;
        statusMsg.innerText = "MỜI ĐẶT CƯỢC";

        timerInterval = setInterval(() => {
            timeLeft--;
            timerEl.innerText = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                processRound();
            }
        }, 1000);
    }

    function processRound() {
        isLocked = true;
        btnBetTai.disabled = true;
        btnBetXiu.disabled = true;
        btnX2.disabled = true;
        statusMsg.innerText = "ĐANG LẮC XÚC XẮC...";

        setTimeout(() => {
            let d1 = Math.floor(Math.random() * 6) + 1;
            let d2 = Math.floor(Math.random() * 6) + 1;
            let d3 = Math.floor(Math.random() * 6) + 1;
            let total = d1 + d2 + d3;
            let result = total >= 11 ? 'TAI' : 'XIU';

            document.getElementById('dice1').innerText = d1;
            document.getElementById('dice2').innerText = d2;
            document.getElementById('dice3').innerText = d3;

            timerEl.style.display = 'none';
            diceContainer.style.display = 'flex';

            let winAmount = 0;
            if (currentBetSide === result) {
                let currentBet = result === 'TAI' ? betTai : betXiu;
                winAmount = Math.floor(currentBet * 1.98);
                balance += winAmount;
                statusMsg.innerText = `KẾT QUẢ: ${total} - ${result} | BẠN THẮNG ${formatMoney(winAmount)}!`;
            } else if (currentBetSide !== null) {
                statusMsg.innerText = `KẾT QUẢ: ${total} - ${result} | BẠN THUA!`;
            } else {
                statusMsg.innerText = `KẾT QUẢ: ${total} - ${result}`;
            }

            addHistory(result);
            updateUI();

            setTimeout(() => {
                resetRound();
            }, 5000);
        }, 2000);
    }

    function resetRound() {
        currentBetSide = null;
        betTai = 0;
        betXiu = 0;
        updateUI();
        startTimer();
    }

    function addHistory(result) {
        history.push(result);
        if (history.length > 12) history.shift();

        historyBar.innerHTML = '';
        history.forEach(res => {
            let dot = document.createElement('div');
            dot.className = `history-dot ${res === 'TAI' ? 'dot-tai' : 'dot-xiu'}`;
            dot.innerText = res === 'TAI' ? 'T' : 'X';
            historyBar.appendChild(dot);
        });
    }

    startTimer();
</script>
</body>
</html>
